name: CapsuleStash
options:
  bundleIdPrefix: com.borasarang
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
targets:
  CapsuleStash:
    type: application
    platform: macOS
    sources:
      - path: CapsuleStash
        excludes:
          - "Resources"
          - "Info.plist"
      - path: CapsuleStash/Resources
        buildPhase: resources
    # T-48 Share 확장을 앱에 내장한다 (PlugIns).
    dependencies:
      - target: ShareExtension
    entitlements:
      path: CapsuleStash/CapsuleStash.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.borasarang.CapsuleStash
    # T-53 URL scheme (capsule://search·save·open).
    # 생성 Info.plist를 쓰므로 INFOPLIST_KEY_* 대신 properties에 전부 둔다.
    # 버전 단일 출처: 아래 MARKETING_VERSION (릴리스 워크플로가 같은 값을 검증).
    info:
      path: CapsuleStash/Info.plist
      properties:
        CFBundleDisplayName: Capsule Stash
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        LSUIElement: true
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.borasarang.CapsuleStash
            CFBundleURLSchemes: [capsule]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.CapsuleStash
        PRODUCT_NAME: CapsuleStash
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  CapsuleStashTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CapsuleStashTests
    dependencies:
      - target: CapsuleStash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.CapsuleStashTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  # T-48 Share 확장. App Group 프로비저닝(유료 팀) 전에는 빌드만 되고
  # 실동작은 안 한다 — 확장이 안내를 띄우고 본체는 폴백 경로로 동작한다.
  ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.borasarang.CapsuleStash
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Capsule Stash에 저장
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareExtension.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.CapsuleStash.ShareExtension
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  CapsuleStash:
    build:
      targets:
        CapsuleStash: all
        CapsuleStashTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CapsuleStashTests
      gatherCoverageData: false
      environmentVariables:
        CAPSULESTASH_TEST_DIR: /tmp/CapsuleStashTests